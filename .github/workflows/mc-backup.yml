name: Minecraft SFTP → Cloud Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00 运行（可改）

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y lftp rsync sshpass unzip
          curl https://rclone.org/install.sh | sudo bash

      - name: Prepare folders
        run: mkdir -p backup

      - name: Fetch files from SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
        run: |
          : "${SFTP_PORT:=22}"
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          DEST="./backup/server_${TIMESTAMP}"
          mkdir -p "$DEST"

          if [ -n "$SFTP_PRIVATE_KEY" ]; then
            echo "$SFTP_PRIVATE_KEY" > ./key.pem
            chmod 600 ./key.pem
            rsync -az -e "ssh -i ./key.pem -o StrictHostKeyChecking=no -p $SFTP_PORT" "$SFTP_USER@$SFTP_HOST:$SFTP_REMOTE_PATH/" "$DEST/" \
            || lftp -u "$SFTP_USER," -p "$SFTP_PORT" sftp://"$SFTP_HOST" -e "mirror $SFTP_REMOTE_PATH $DEST; quit"
          else
            lftp -u "$SFTP_USER,$SFTP_PASSWORD" -p "$SFTP_PORT" sftp://"$SFTP_HOST" -e "mirror $SFTP_REMOTE_PATH $DEST; quit"
          fi

      - name: Create compressed archive
        run: |
          TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          tar -czf "mc-backup-${TIMESTAMP}.tar.gz" -C backup .
          ls -lh "mc-backup-${TIMESTAMP}.tar.gz"

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Upload to cloud
        env:
          RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
          RCLONE_REMOTE_PATH: ${{ secrets.RCLONE_REMOTE_PATH }}
        run: |
          ARCHIVE=$(ls mc-backup-*.tar.gz | tail -n 1)
          rclone copy "$ARCHIVE" "$RCLONE_REMOTE_NAME:$RCLONE_REMOTE_PATH" --progress

      - name: Cleanup old backups
        if: ${{ secrets.BACKUP_RETENTION_DAYS != '' }}
        env:
          RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
          RCLONE_REMOTE_PATH: ${{ secrets.RCLONE_REMOTE_PATH }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
        run: |
          rclone delete "$RCLONE_REMOTE_NAME:$RCLONE_REMOTE_PATH" --min-age "${BACKUP_RETENTION_DAYS}d"
          rclone rmdirs "$RCLONE_REMOTE_NAME:$RCLONE_REMOTE_PATH" --leave-root