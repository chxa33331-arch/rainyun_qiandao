name: Python Minecraft Auto Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 每天 03:00 UTC 执行

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          pip install paramiko
          pip install rclone-python

      - name: Write rclone config
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf

      - name: Run Backup Script (Python)
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_REMOTE_PATH: ${{ secrets.SFTP_REMOTE_PATH }}
          RCLONE_REMOTE_NAME: ${{ secrets.RCLONE_REMOTE_NAME }}
          RCLONE_REMOTE_PATH: ${{ secrets.RCLONE_REMOTE_PATH }}
        run: |
          python3 << 'EOF'
          import os, paramiko, zipfile, time, subprocess, base64

          host = os.getenv("SFTP_HOST")
          port = int(os.getenv("SFTP_PORT", "22"))
          user = os.getenv("SFTP_USER")
          password = os.getenv("SFTP_PASSWORD")
          key_data = os.getenv("SFTP_PRIVATE_KEY")
          remote_path = os.getenv("SFTP_REMOTE_PATH")

          remote_name = os.getenv("RCLONE_REMOTE_NAME")
          remote_backup_dir = os.getenv("RCLONE_REMOTE_PATH")

          timestamp = time.strftime("%Y%m%dT%H%M%SZ")
          local_dir = f"backup_{timestamp}"
          os.makedirs(local_dir, exist_ok=True)

          print("===== CONNECTING TO SFTP SERVER =====")

          transport = paramiko.Transport((host, port))

          if key_data:
            print("Using private key authentication")
            pkey = paramiko.RSAKey.from_private_key(file_obj=open("/dev/stdin", "r"), password=None)
          else:
            print("Using password authentication")

          # Setup private key if exists
          if key_data:
            with open("sftp_key.pem", "w") as f:
              f.write(key_data)
            private_key = paramiko.RSAKey.from_private_key_file("sftp_key.pem")
            transport.connect(username=user, pkey=private_key)
          else:
            transport.connect(username=user, password=password)

          sftp = paramiko.SFTPClient.from_transport(transport)

          def download_recursive(remote, local):
            os.makedirs(local, exist_ok=True)
            for item in sftp.listdir_attr(remote):
              remote_item = remote + "/" + item.filename
              local_item = local + "/" + item.filename
              if paramiko.sftp_attr.S_ISDIR(item.st_mode):
                download_recursive(remote_item, local_item)
              else:
                print("Downloading:", remote_item)
                sftp.get(remote_item, local_item)

          print("===== START DOWNLOADING SERVER FILES =====")
          download_recursive(remote_path, local_dir)
          sftp.close()
          transport.close()

          zip_name = f"mc-backup-{timestamp}.zip"
          print("===== COMPRESSING INTO ZIP =====")
          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zipf:
              for root, dirs, files in os.walk(local_dir):
                  for file in files:
                      filepath = os.path.join(root, file)
                      zipf.write(filepath)

          print("Created ZIP:", zip_name)

          print("===== UPLOADING TO ONEDRIVE BY RCLONE =====")
          subprocess.run([
              "rclone",
              "copy",
              zip_name,
              f"{remote_name}:{remote_backup_dir}",
              "--progress"
          ], check=True)

          print("===== DONE =====")
          EOF

      - name: Upload artifact for checking
        uses: actions/upload-artifact@v4
        with:
          name: latest-backup
          path: mc-backup-*.zip
